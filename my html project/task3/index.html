<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac box </title>
</head>
<body>
    <table border="4" width="500" height="400" text-align="center" >
        <tr>
            <td colspan="3" style="text-align:center; background-color:#f7d063;"><b>1</b></td>
        </tr>
        <tr>
            <td style="text-align:center; background-color:rgb(247, 45, 129);"><b>2</b></td>
            <td rowspan="2" style="text-align:center; background-color:#f7d063;"><b>3</b></td>
            <td style="text-align:center; background-color:rgb(247, 45, 129);"><b>4</b></td>
        </tr> 
        <tr>
            <td rowspan="2" style="text-align:center; background-color:#f7d063;"><b>5</b></td>
            <td style="text-align:center; background-color:rgb(247, 45, 129);"><b>6</b></td>
        </tr>
        <tr>
            <td colspan="3" style="text-align:center; background-color:#f7d063;"><b>7</b></td>
        </tr>
    </table>
</body>
</html>
