<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="row justify-content-center mt-4">
            <div class="col-md-6 col-lg-5">
                <div class="text-center mb-3">
                    <h2>Create Account</h2>
                    <p class="text-muted fw-semibold lead">Get started with your free account</p>
                </div>

                <div class="d-grid gap-2 mb-3"> 
                    <button class="btn btn-info text-white" type="button">
                        <i class="bi bi-twitter"></i> Login via Twitter
                    </button>
                    <button class="btn" type="button" style="background-color: #4267B2; color: white;">
                        <i class="bi bi-facebook"></i> Login via Facebook
                    </button>
                </div>

                <div class="text-center mb-3">
                    <div class="d-flex align-items-center">
                        <hr class="flex-grow-1">
                        <span class="text-muted px-3">OR</span>
                        <hr class="flex-grow-1">
                    </div>
                </div>

                <form>
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" class="form-control" placeholder="Full name">
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control" placeholder="Email address">
                        </div>
                    </div>
                    <div class="mb-3 row g-0">
                        <div class="col-4">
                            <select class="form-select">
                                <option selected>+971</option>
                                <option>+1</option>
                                <option>+44</option>
                            </select>
                        </div>
                        <div class="col-8">
                            <input type="tel" class="form-control" placeholder="Phone number">
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-building"></i></span>
                            <select class="form-select">
                                <option selected>Select job type</option>
                                <option>Developer</option>
                                <option>Designer</option>
                                <option>Manager</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" placeholder="Create password">
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" placeholder="Repeat password">
                        </div>
                    </div>
                    <div class="d-grid mb-3">
                        <button class="btn btn-primary" type="submit">Create Account</button>
                    </div>
                    <div class="text-center">
                        <small>Have an account? <a href="#" style="text-decoration: none;">Log In</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap Icons (optional for social media icons) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</body>

</html>
